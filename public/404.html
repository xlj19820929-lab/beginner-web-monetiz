<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Cloudflare Pages serves this file for any request that does not match a
      real asset, and crucially it returns an HTTP 404 alongside it. Relying on
      the SPA fallback instead would answer missing URLs with 200 and a rendered
      "not found" view — a soft 404 that makes crawlers treat dead URLs as real
      pages and waste crawl budget probing paths that do not exist.
    -->
    <title>Page not found | ToolKit</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#0b9466" />

    <style>
      :root {
        --brand-600: #0b9466;
        --ink-900: #0f172a;
        --ink-500: #64748b;
        --ink-200: #e2e8f0;
        --ink-50: #f8fafc;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--ink-50);
        color: var(--ink-900);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 32rem;
        width: 100%;
        text-align: center;
      }
      .code {
        font-size: 3.5rem;
        font-weight: 800;
        color: var(--brand-600);
        letter-spacing: -0.02em;
        margin: 0;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0.5rem 0 0.75rem;
      }
      p {
        color: var(--ink-500);
        margin: 0 0 1.75rem;
      }
      a.home {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border-radius: 0.75rem;
        background: var(--brand-600);
        color: #fff;
        font-weight: 600;
        font-size: 0.95rem;
        text-decoration: none;
      }
      a.home:hover { filter: brightness(0.93); }
      nav {
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--ink-200);
      }
      nav span {
        display: block;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--ink-500);
        margin-bottom: 0.75rem;
      }
      nav ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.5rem 1.25rem;
      }
      nav a {
        color: var(--brand-600);
        font-size: 0.9rem;
        text-decoration: none;
      }
      nav a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>
        The page you are looking for does not exist or may have been moved.
        <br />
        你要访问的页面不存在，或者可能已被移动。
      </p>

      <a class="home" href="/">Back to all tools / 返回工具首页</a>

      <nav aria-label="Site links">
        <span>Popular tools / 常用工具</span>
        <ul>
          <li><a href="/tools/word-counter">Word Counter</a></li>
          <li><a href="/tools/password-generator">Password Generator</a></li>
          <li><a href="/tools/unit-converter">Unit Converter</a></li>
          <li><a href="/tools/color-converter">Color Converter</a></li>
          <li><a href="/tools/case-converter">Case Converter</a></li>
          <li><a href="/tools/bmi-calculator">BMI Calculator</a></li>
        </ul>
      </nav>
    </main>
  </body>
</html>
