<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>ToolKit — Free Online Tools for Everyone</title>
    <meta
      name="description"
      content="Use 6+ free online tools: password generator, word counter, unit converter, color converter, case converter and BMI calculator. No signup, no installs — everything runs privately in your browser."
    />
    <meta
      name="keywords"
      content="free online tools, password generator, word counter, unit converter, color converter, case converter, BMI calculator, browser tools"
    />
    <meta name="author" content="ToolKit" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="theme-color" content="#0b9466" />
    <link rel="canonical" href="https://beginner-web-monetiz.pages.dev/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ToolKit" />
    <meta property="og:title" content="ToolKit — Free Online Tools for Everyone" />
    <meta
      property="og:description"
      content="Free, fast, privacy-friendly online tools. No signups, no ads clutter, works entirely in your browser."
    />
    <meta property="og:url" content="https://beginner-web-monetiz.pages.dev/" />
    <meta property="og:image" content="https://beginner-web-monetiz.pages.dev/og-image.svg" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ToolKit — Free Online Tools for Everyone" />
    <meta
      name="twitter:description"
      content="Free, fast, privacy-friendly online tools. No signups, works entirely in your browser."
    />
    <meta name="twitter:image" content="https://beginner-web-monetiz.pages.dev/og-image.svg" />

    <!-- Performance hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://pagead2.googlesyndication.com" />

    <!-- Structured data for the site itself -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "ToolKit",
        "alternateName": "Free Online Tools for Everyone",
        "url": "https://beginner-web-monetiz.pages.dev/",
        "description": "Free, browser-based online tools including a password generator, word counter, unit converter, color converter, case converter and BMI calculator.",
        "inLanguage": "en"
      }
    </script>

    <!--
      Google Consent Mode v2 — defaults.

      All advertising and analytics storage is set to "denied" before any Google
      script runs, so no advertising cookies can be set until the visitor grants
      consent through the on-page cookie banner.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500,
      });
    </script>

    <!--
      Google AdSense — loaded ON DEMAND, not on page load.

      The AdSense library is deliberately NOT included as a static <script> tag
      here. It is injected at runtime by `loadAdSense()` in src/lib/consent.ts,
      and only after the visitor has actively granted permission via the banner.

      Result:
        - no consent recorded  -> AdSense script never requested
        - "Essential only"     -> AdSense script never requested
        - "Accept all"         -> AdSense script injected, ads may be shown

      This satisfies the requirement that the advertising script must not be
      loaded before the user consents. Visitors who never consent can still use
      every tool on the site.
    -->

    <!--
      Google AdSense — site ownership verification.

      Only the verification meta tag is placed statically. It proves we control
      the site without downloading or executing any advertising code, which
      keeps the consent-first design below intact. The AdSense library itself is
      injected at runtime by `loadAdSense()` in src/lib/consent.ts, and only
      after the visitor has actively granted permission via the banner.
    -->
    <meta name="google-adsense-account" content="ca-pub-6410031165107651" />

    <!--
      Google Search Console — site ownership verification.

      Placed statically so it is present in the first HTML response, before any
      JavaScript runs. Prerendering copies this into every route's static file,
      which keeps verification valid on any URL Google checks.
    -->
    <meta
      name="google-site-verification"
      content="8_4FCogggJu4nB9ak35cMgyQwCsPWgDeBLCFs-p3Dfc"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
